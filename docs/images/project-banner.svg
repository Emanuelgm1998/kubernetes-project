    </g>

    <g transform="translate(1250 145)">
      <rect width="246" height="246" rx="28" fill="#091a2c" fill-opacity=".86" stroke="#38bdf8" stroke-opacity=".55"/>
      <text x="123" y="65" text-anchor="middle" fill="#94a3b8" font-size="17" font-weight="650" letter-spacing="2">DEPLOYMENT</text>
      <text x="123" y="132" text-anchor="middle" fill="#4ade80" font-size="47" font-weight="800">VALIDATED</text>
      <path d="m82 174 27 27 56-63" fill="none" stroke="#4ade80" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="123" y="225" text-anchor="middle" fill="#cbd5e1" font-size="17">AWS · Kubernetes · IaC</text>
