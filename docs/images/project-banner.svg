<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">AWS EKS Enterprise Kubernetes Platform</title>
  <desc id="desc">Enterprise portfolio banner for an Amazon EKS platform built with Terraform, Kubernetes, Argo CD and GitHub Actions using DevSecOps, Zero Trust and cloud security practices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#102f4c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#844fba"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".19"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1320" cy="95" r="310" fill="url(#glow)"/>
  <circle cx="210" cy="505" r="300" fill="url(#glow)" opacity=".55"/>
  <g opacity=".10" stroke="#bae6fd" fill="none">
    <path d="M0 98H1600M0 260H1600M0 422H1600"/>
    <path d="M160 0V520M480 0V520M800 0V520M1120 0V520M1440 0V520"/>
  </g>
  <rect x="74" y="58" width="1452" height="4" rx="2" fill="url(#line)"/>

  <g transform="translate(92 112)" filter="url(#shadow)">
    <path d="M115 0 215 58v116l-100 58L15 174V58z" fill="#091a2c" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="115" cy="116" r="59" fill="none" stroke="#ff9900" stroke-width="9"/>
    <g stroke="#e0f2fe" stroke-width="8" stroke-linecap="round">
      <path d="M115 32v30M115 170v30M31 116h30M169 116h30M56 57l22 22M152 153l22 22M174 57l-22 22M78 153l-22 22"/>
    </g>
    <circle cx="115" cy="116" r="19" fill="#38bdf8"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="362" y="135" fill="#ffb84d" font-size="23" font-weight="700" letter-spacing="4">AMAZON WEB SERVICES · AMAZON EKS</text>
    <text x="362" y="207" fill="#f8fafc" font-size="52" font-weight="bold">Enterprise Kubernetes Platform</text>
    <text x="364" y="255" fill="#bae6fd" font-size="25" font-weight="400">Secure multi-AZ infrastructure · GitOps delivery · evidence-driven validation</text>

    <g font-size="19" font-weight="650" text-anchor="middle">
      <g transform="translate(362 302)">
        <rect width="184" height="52" rx="12" fill="#132c45" stroke="#326ce5"/>
        <text x="92" y="33" fill="#eaf2ff">Kubernetes 1.35</text>
      </g>
      <g transform="translate(562 302)">
        <rect width="146" height="52" rx="12" fill="#132c45" stroke="#844fba"/>
        <text x="73" y="33" fill="#f3e8ff">Terraform</text>
      </g>
      <g transform="translate(724 302)">
        <rect width="126" height="52" rx="12" fill="#132c45" stroke="#f97316"/>
        <text x="63" y="33" fill="#ffedd5">Argo CD</text>
      </g>
      <g transform="translate(866 302)">
        <rect width="190" height="52" rx="12" fill="#132c45" stroke="#94a3b8"/>
        <text x="95" y="33" fill="#f8fafc">GitHub Actions</text>
      </g>
    </g>

    <g font-size="17" font-weight="650" text-anchor="middle">
      <g transform="translate(362 375)">
        <rect width="150" height="45" rx="22.5" fill="#0d3b3a" stroke="#2dd4bf"/>
        <text x="75" y="29" fill="#99f6e4">DevSecOps</text>
      </g>
      <g transform="translate(528 375)">
        <rect width="146" height="45" rx="22.5" fill="#113451" stroke="#38bdf8"/>
