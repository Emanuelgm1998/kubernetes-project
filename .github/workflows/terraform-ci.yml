name: Terraform CI

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

jobs:
  terraform:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Terraform Format
        working-directory: .
        run: terraform fmt -recursive -check terraform

      - name: Terraform Init
        working-directory: terraform/bootstrap/state
        run: terraform init -backend=false -input=false

      - name: Terraform Validate State Bootstrap
        working-directory: terraform/bootstrap/state
        run: terraform validate

      - name: Terraform Init Environment
        run: terraform init -backend=false -input=false

      - name: Terraform Validate Environment
        run: terraform validate
