name: Platform Manifests CI

on:
  pull_request:
    paths:
      - "argocd/**"
      - "helm-values/**"
      - "kubernetes/**"
      - "scripts/**"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "argocd/**"
      - "helm-values/**"
      - "kubernetes/**"
      - "scripts/**"
      - ".github/workflows/platform-ci.yml"

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install YAML and shell linters
        run: |
          python -m pip install --disable-pip-version-check yamllint==1.37.1
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint YAML
        run: yamllint -c .yamllint .github argocd helm-values kubernetes

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh

      - name: Render Kustomize
        run: |
          kubectl kustomize kubernetes >/dev/null
          kubectl kustomize argocd/applications >/dev/null

      - name: Render pinned Helm releases
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm template aws-load-balancer-controller eks/aws-load-balancer-controller --version 3.4.2 --namespace kube-system --set clusterName=test --set vpcId=vpc-00000000000000000 >/dev/null
          helm template external-secrets external-secrets/external-secrets --version 2.8.0 --namespace external-secrets --set installCRDs=true >/dev/null
          helm template argocd argo/argo-cd --version 10.1.4 --namespace argocd --values argocd/bootstrap/values.yaml >/dev/null
